out_of_scope:
  - name: InDialerData
    reason: >
      Confirmed to exist as a separate physical database (merge-replicated,
      same as InData), but its internal structure (does it have its own
      replicated/non-replicated split) has not been investigated. Explicitly
      out of scope for this POC. Don't build projects for it without first
      getting the same answers that shaped incode/indata: is it a uniform
      bucket or a mix, and is there a manifest entry or naming convention
      for it.
  - name: Data warehouse (DW)
    reason: >
      Separate from Core, runs on SQL Server Always On availability
      groups, no A/B merge replication complexity. Out of scope for this
      POC. Would follow the same pattern if brought in later, likely
      simpler than Core since Always On replicates automatically.

notes:
  - >
    Replication is now configured on Huxley's dev box for the "CL1"
    client only (CoreInData_A publisher, CoreInData_B subscriber, merge
    replication with 11 articles matching the replicated: true entries
    here). The setup script is local, not in the repo. A parallel "RG"
    client (Redgate_CoreInData_NodeA / NodeB) exists without
    replication for testing routing without merge-repl side effects.
    See CLAUDE.md's Environments section for full detail. The dev
    database itself (CoreInData_Dev) is still plain, standalone, with
    all InData tables in it — replication only affects the prod nodes.
  - >
    Deployment strategy is migrations-based (flyway migrate / undo), not
    state-based (prepare / deploy). Developer-side authoring still uses
    diff / model / generate against each project's own schema model.
  - >
    This is a synthetic, illustrative schema, not the client's real table
    list. The client has agreed to share a sample of their real manifest
    file. Swap these entries for it once received, the structure of this
    file does not need to change.
  - >
    A and B are not fixed, stable labels in the client's real environment.
    Which physical node is "active" versus "passive" can differ by
    database and even by cluster parity. Treat A/B here as relative roles
    for a single cluster's production simulation, not a global identity,
    before this goes anywhere near real replication modelling. Table names
    like ActiveNodeConfig or PassiveNodeHealthCheck are historical from
    the client and do NOT imply the table is node-scoped, trust the
    `replicated` flag, not the name.
