# manifest.yaml
#
# Single source of truth mapping database objects to the Flyway project that
# owns them, and (for tables in InData) whether they are part of the
# merge-replicated pool. Mirrors the client's own manifest file (checked
# into their GitHub repo, manually maintained), which decides how a script
# is deployed across their two-node production estate.
#
# Used by CLAUDE.md to route a developer's change to the correct project,
# and (for InData tables) to the correct migrations subfolder. When a new
# object is created and its classification isn't obvious, ask the developer
# which bucket it belongs to, then add it here.

projects:
  incode:
    description: >
      Stored procedures, functions and other code-only objects. Contains no
      tables. In production, deployed identically to both nodes on every
      release, independent of replication.
    deploy_targets: [A, B]
    objects:
