  indata:
    description: >
      All tables that live on the InData database in production, whether
      they are part of the merge-replicated pool or not. One Flyway project
      because in production these are the same physical database, and in
      dev there is only one database, no A/B split simulated.

      The per-object `replicated` flag is the routing signal:

        - replicated: true  -> migrations/ReplTables. In production these
          get deployed to whichever node is currently primary; SQL Server
          merge replication propagates the change to the secondary. Changes
          here are the ones limited to twice-yearly releases in production
          because they trigger a full replication rebuild.
        - replicated: false -> migrations/NonReplTables. In production these
          get deployed directly and identically to both nodes on every
          release. Routine cadence.

      Downstream CLI automation reads this flag to decide which
      subfolder a generated migration script lands in, don't remove the
      flag from any entry.

      Note: the client's own naming convention for "which node" a table is
      "on" is inconsistent, so historical names like ActiveNodeConfig or
      PassiveNodeHealthCheck should not be taken as evidence that a table
      is node-scoped. The `replicated` flag here is authoritative, the
      names are not.
    deploy_targets: [A, B]
    objects:
      - type: table
        name: dbo.Agents
        replicated: true
      - type: table
        name: dbo.AgentGroups
        replicated: true
      - type: table
        name: dbo.Customers
